name: CI

on:
  pull_request:
  push:
    branches: [develop, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1
  # Public placeholders so `next build` can run without real infrastructure.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build --filter=web...

  database:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase, apply migrations and seeds
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Lint database
        run: supabase db lint --level warning --fail-on warning

      - name: Run pgTAP tests (RLS policies, invariants)
        run: supabase test db

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (migrations + seed)
        id: supabase
        run: |
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          supabase status -o env >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web against local Supabase
        run: pnpm build --filter=web...
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

      - name: Run end-to-end tests
        run: pnpm --filter web test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
